name: '🧑‍🏭'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    runs-on: codeberg-small
    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
